name: 📊 月度数据整合

# 触发条件：每月 1 号 UTC 时间 00:00 运行
on:
  schedule:
    # 每月 1 号 00:00 UTC 运行（北京时间 08:00）
    - cron: '0 0 1 * *'
  
  # 允许手动触发
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  REPORTS_DIR: 'reports'
  DATA_DIR: 'data'

jobs:
  monthly-integration:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      # 步骤 1: 检出代码
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 步骤 2: 设置 Node.js
      - name: 🔧 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      # 步骤 3: 安装依赖
      - name: 📦 安装依赖
        run: npm install --prefer-offline --no-audit
      
      # 步骤 4: 创建报告目录
      - name: 📁 创建报告目录
        run: |
          mkdir -p ${{ env.REPORTS_DIR }}
          mkdir -p ${{ env.DATA_DIR }}
      
      # 步骤 5: 生成月度报告
      - name: 📊 生成月度报告
        run: node scripts/generate-monthly-report.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 步骤 6: 导出月度数据
      - name: 💾 导出月度数据
        run: node scripts/export-monthly-data.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      # 步骤 7: 更新 README 统计
      - name: 📈 更新 README 统计
        run: node scripts/update-readme-stats.js
      
      # 步骤 8: 提交更改到 Git
      - name: 📝 提交更改
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --quiet && ! git diff --staged --quiet; then
            git commit -m "📊 月度数据整合 $(date +%Y-%m-%d)"
            git push
          else
            echo "没有更改需要提交"
          fi
        if: always()
      
      # 步骤 9: 创建 GitHub Issue
      - name: 🔔 创建 GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const reportPath = `reports/monthly-report-${year}-${month}.md`;
            
            let reportContent = '📊 月度数据整合已完成\n\n';
            
            if (fs.existsSync(reportPath)) {
              const content = fs.readFileSync(reportPath, 'utf-8');
              reportContent += content.slice(0, 1000) + '\n\n[查看完整报告](' + reportPath + ')';
            } else {
              reportContent += '报告文件已生成，请查看 reports 目录';
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 ${year} 年 ${month} 月月度整合完成`,
              body: reportContent + `\n\n---\n\n**自动生成于**: ${new Date().toISOString()}\n**工作流运行**: [#${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['monthly-integration', 'automated']
            });
        if: always()
      
      # 步骤 10: 上传报告到 Artifacts
      - name: 📤 上传报告到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monthly-reports-${{ github.run_id }}
          path: ${{ env.REPORTS_DIR }}/
          retention-days: 90
        if: always()
      
      # 步骤 11: 上传导出数据到 Artifacts
      - name: 📤 上传导出数据到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monthly-data-exports-${{ github.run_id }}
          path: ${{ env.DATA_DIR }}/
          retention-days: 90
        if: always()
      
      # 步骤 12: 发送邮件提醒
      - name: 📧 发送邮件提醒
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '📊 Nova-Mind 月度数据整合完成 - ${{ github.run_id }}'
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            亲爱的 Nova-Mind 用户，

            🎉 本月的月度数据整合已完成！

            📊 本月统计信息：
            - 工作流运行 ID: ${{ github.run_id }}
            - 完成时间: $(date)
            - 仓库: ${{ github.repository }}

            📁 生成的文件：
            - 月度报告: reports/monthly-report-$(date +%Y-%m).md
            - 导出数据: data/export-$(date +%Y-%m).json
            - README 已更新

            💡 建议的后续步骤：
            1. 查看生成的月度报告
            2. 导出的数据已保存在 GitHub Artifacts
            3. 登录 Manus 平台进行深度分析
            4. 使用月度免费额度处理核心任务

            🔗 相关链接：
            - GitHub 仓库: ${{ github.server_url }}/${{ github.repository }}
            - 工作流运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Manus 平台: https://nova-mind-chat.manus.space
            - 部署地址: ${{ secrets.DEPLOYMENT_URL || 'https://your-app.vercel.app' }}

            📝 注意：
            - 报告已自动提交到 GitHub
            - 数据已备份到 Artifacts（保留 90 天）
            - 下个月 1 号将自动运行下一次整合

            祝你使用愉快！

            ---
            Nova-Mind 自动化系统
            ${{ github.server_url }}/${{ github.repository }}
        if: always() && secrets.EMAIL_SERVER != ''
      
      # 步骤 13: 发送 Slack 通知（可选）
      - name: 💬 发送 Slack 通知
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "📊 Nova-Mind 月度数据整合完成",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📊 Nova-Mind 月度数据整合"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*状态*\n✅ 完成"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*时间*\n$(date)"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*仓库*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*运行 ID*\n${{ github.run_id }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ 完成的任务*\n• 生成月度报告\n• 导出月度数据\n• 更新 README 统计\n• 提交更改到 Git\n• 创建 GitHub Issue"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "查看工作流"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "查看仓库"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
      
      # 步骤 14: 生成工作流摘要
      - name: 📋 生成工作流摘要
        run: |
          echo "## 📊 月度数据整合完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ 所有任务已完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 生成的文件" >> $GITHUB_STEP_SUMMARY
          echo "- 月度报告: \`reports/monthly-report-$(date +%Y-%m).md\`" >> $GITHUB_STEP_SUMMARY
          echo "- 导出数据: \`data/export-$(date +%Y-%m).json\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 下一步" >> $GITHUB_STEP_SUMMARY
          echo "1. 查看生成的报告" >> $GITHUB_STEP_SUMMARY
          echo "2. 在 Manus 平台进行深度分析" >> $GITHUB_STEP_SUMMARY
          echo "3. 使用月度免费额度处理核心任务" >> $GITHUB_STEP_SUMMARY
        if: always()
